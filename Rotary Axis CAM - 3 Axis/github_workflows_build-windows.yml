name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10']  # change if you need a different Python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "requirements-brian.txt"
          python -m pip install pyinstaller

      - name: Install UPX (required if your spec uses upx=True)
        shell: pwsh
        run: |
          choco install upx -y

      - name: Build with PyInstaller (run spec from repo root)
        shell: pwsh
        run: |
          # run PyInstaller and capture a build log
          python -m PyInstaller --clean --noconfirm --log-level=DEBUG "Rotary Axis CAM - 3 Axis/Brian_Rotary_CAM.spec" 2>&1 | Tee-Object -FilePath build.log

      - name: Show dist contents
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Force -Path ./dist | Select-Object FullName, Length

      - name: Package built EXE folder
        shell: pwsh
        run: |
          $out = "rotary-axis-cam-windows.zip"
          Remove-Item $out -ErrorAction Ignore
          Compress-Archive -Path "dist/Rotary Axis CAM - 3 Axis/*" -DestinationPath $out -Force
          Write-Output "Created artifact: $out"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rotary-axis-cam-windows
          path: rotary-axis-cam-windows.zip

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log